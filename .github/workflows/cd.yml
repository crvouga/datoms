name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose --version
          docker compose up -d

      - name: Wait for databases to be healthy
        run: |
          set -e
          docker compose ps
          function wait_for_healthy() {
            service="$1"
            timeout="${2:-60}"
            elapsed=0
            while [ "$(docker inspect --format='{{json .State.Health.Status}}' "$service")" != "\"healthy\"" ]; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "Service $service did not become healthy in $timeout seconds"
                docker compose logs $service
                exit 1
              fi
              sleep 2
              elapsed=$((elapsed+2))
            done
          }
          wait_for_healthy datoms-postgres 60
          wait_for_healthy datoms-mysql 60
          wait_for_healthy datoms-mariadb 60

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.js || exit 1
          test -f dist/index.d.ts || exit 1

  # Publishes to npm automatically when commits follow conventional commit format
  # Requires NPM_TOKEN secret to be set in repository settings
  # Version is determined automatically based on commit messages:
  # - BREAKING CHANGE or ! in footer/scope = major version
  # - feat: = minor version
  # - fix: = patch version
  publish:
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
