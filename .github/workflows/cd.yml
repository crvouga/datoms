name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

  type-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bunx tsc --noEmit

  format:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run format:check

  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: |
          docker compose --version
          docker compose up -d

      - name: Wait for databases to be healthy
        run: |
          set -e
          docker compose ps
          function wait_for_healthy() {
            service_name="$1"
            timeout="${2:-60}"
            elapsed=0
            # Get the actual container name from docker compose
            container_name=$(docker compose ps -q "$service_name" | head -n1)
            if [ -z "$container_name" ]; then
              echo "Could not find container for service $service_name"
              exit 1
            fi
            while [ "$(docker inspect --format='{{json .State.Health.Status}}' "$container_name")" != "\"healthy\"" ]; do
              if [ "$elapsed" -ge "$timeout" ]; then
                echo "Service $service_name did not become healthy in $timeout seconds"
                docker compose logs $service_name
                exit 1
              fi
              sleep 2
              elapsed=$((elapsed+2))
            done
            echo "Service $service_name is healthy"
          }
          wait_for_healthy postgres 60
          wait_for_healthy mysql 60
          wait_for_healthy mariadb 60

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, type-check, format, test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

  # Publishes to npm automatically when commits follow conventional commit format
  # Requires NPM_TOKEN secret to be set in repository settings
  # Version is determined automatically based on commit messages:
  # - BREAKING CHANGE or ! in footer/scope = major version
  # - feat: = minor version
  # - fix: = patch version
  publish:
    needs: [lint, type-check, format, test, e2e]
    runs-on: ubuntu-latest
    if: false # Disabled: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
